name: Build NetherSX2 xdelta

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdelta3 xmlstarlet zipalign

      - name: Build NetherSX2 and generate xdelta
        run: python3 scripts/build.py

      - name: Upload nethersx2.xdelta
        uses: actions/upload-artifact@v4
        with:
          name: nethersx2.xdelta
          path: nethersx2.xdelta
          if-no-files-found: error
